[project]
name = "rtds-project"
version = "0.1.0"
description = "Research Topics in Data Science course project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "treefarms>=0.2.4",
    "ortools>=9.9,<9.16",
    "scikit-learn>=1.4,<1.9",
    "pandas>=2.2,<3",
    "numpy>=2.0.2,<3",
    "scipy>=1.13,<2",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "experiments"]
